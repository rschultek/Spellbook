name: "Setup Node.js"
description: "Composite action to setup Node.js environment with caching"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js with version from .nvmrc
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
